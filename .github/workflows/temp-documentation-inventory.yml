name: temporary documentation inventory regeneration
on:
  pull_request:
    paths:
      - '.github/workflows/temp-documentation-inventory.yml'
      - 'scripts/generate-documentation-inventory.py'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Regenerate inventory
        run: python3 scripts/generate-documentation-inventory.py
      - name: Commit generated inventory
        run: |
          if git diff --quiet -- docs/DOCUMENTATION_INVENTORY.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOCUMENTATION_INVENTORY.md
          git commit -m 'docs: regenerate documentation inventory'
          git push origin HEAD:${{ github.head_ref }}
