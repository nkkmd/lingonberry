name: temporary documentation inventory regeneration
on:
  push:
    branches:
      - agent/close-quarantine-replacement-operations-hardening-inventory
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-quarantine-replacement-operations-hardening-inventory
      - run: python3 scripts/generate-documentation-inventory.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/DOCUMENTATION_INVENTORY.md
          git commit -m "docs: regenerate documentation inventory"
          git push
