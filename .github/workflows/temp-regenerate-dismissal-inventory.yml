name: temporary dismissal inventory regeneration

on:
  push:
    branches:
      - agent/close-quarantine-dismissals-inventory

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-quarantine-dismissals-inventory
          fetch-depth: 0
      - name: Regenerate and commit exact inventory
        run: |
          python scripts/generate-documentation-inventory.py
          rm .github/workflows/temp-regenerate-dismissal-inventory.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/DOCUMENTATION_INVENTORY.md .github/workflows/temp-regenerate-dismissal-inventory.yml
          git commit -m "docs: apply generated documentation inventory"
          git push origin HEAD:agent/close-quarantine-dismissals-inventory
