name: temporary add transition object inventory

on:
  push:
    branches:
      - agent/close-transition-object-inventory
    paths:
      - '.github/workflows/tmp-add-transition-object-inventory.yml'

permissions:
  contents: write

jobs:
  update-generator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-transition-object-inventory
          fetch-depth: 0
      - name: Add normalized protocol document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-documentation-inventory.py')
          text = p.read_text()
          anchor = '    "docs/protocols/TRANSITION_EVIDENCE_GENERATION.md",\n'
          entry = '    "docs/protocols/TRANSITION_OBJECT.md",\n'
          assert entry not in text
          assert anchor in text
          p.write_text(text.replace(anchor, anchor + entry))
          PY
      - name: Commit generator only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-documentation-inventory.py
          git commit -m 'docs: classify transition object'
          git push origin HEAD:agent/close-transition-object-inventory
