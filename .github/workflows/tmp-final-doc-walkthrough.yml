name: temporary final documentation walkthrough
on:
  pull_request:
    paths:
      - 'docs/security/**'
      - 'docs/DOCUMENTATION_INVENTORY.md'
      - 'scripts/generate-documentation-inventory.py'
      - '.github/workflows/tmp-final-doc-walkthrough.yml'
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: f9543019f2c219aea3b085ff90f2da201b268a48
    steps:
      - uses: actions/checkout@v4
        with: {path: harness}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: candidate}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: bash harness/scripts/run-v1-documentation-walkthrough.sh candidate harness/target/v1-documentation-walkthrough
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('harness/target/v1-documentation-walkthrough/summary.json').read_text())
          assert s['candidateCommit']=='f9543019f2c219aea3b085ff90f2da201b268a48'
          assert s['status']=='passed' and len(s['procedures'])==16
          assert all(x['status']=='passed' for x in s['procedures'])
          PY
          (cd harness/target/v1-documentation-walkthrough && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-documentation-walkthrough-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: harness/target/v1-documentation-walkthrough/
          if-no-files-found: error
          retention-days: 90
