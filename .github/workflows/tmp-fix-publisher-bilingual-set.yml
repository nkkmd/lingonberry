name: temporary fix publisher bilingual set

on:
  push:
    branches:
      - agent/fix-publisher-quickstart-placement
    paths:
      - '.github/workflows/tmp-fix-publisher-bilingual-set.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-publisher-quickstart-placement
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-documentation-inventory.py')
          text = p.read_text()
          start = text.index('BILINGUAL_REQUIRED = {')
          end = text.index('REVIEWED_BILINGUAL_REQUIRED = {')
          block = text[start:end]
          entry = '    "docs/developers/PUBLISHER_QUICKSTART.md",\n'
          if entry not in block:
              block = block.replace('    "README.md",\n', '    "README.md",\n' + entry, 1)
              text = text[:start] + block + text[end:]
          p.write_text(text)
          PY
          python3 scripts/generate-documentation-inventory.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-documentation-inventory.py docs/DOCUMENTATION_INVENTORY.md
          git commit -m 'docs: classify publisher quickstart as bilingual required'
          git push origin HEAD:agent/fix-publisher-quickstart-placement
