name: temporary fix publisher quickstart placement

on:
  push:
    branches:
      - agent/fix-publisher-quickstart-placement
    paths:
      - '.github/workflows/tmp-fix-publisher-quickstart-placement.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-publisher-quickstart-placement
          fetch-depth: 0
      - name: Consolidate publisher quickstart
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('PUBLISHER_QUICKSTART.md')
          if root.exists():
              root.unlink()

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('[Publisher Quickstart](PUBLISHER_QUICKSTART.md)', '[Publisher Quickstart](docs/developers/PUBLISHER_QUICKSTART.md)')
          readme.write_text(text)

          ops = Path('docs/operations/README.md')
          text = ops.read_text()
          text = text.replace('[Publisher Quickstart](../../PUBLISHER_QUICKSTART.md)', '[Publisher Quickstart](../developers/PUBLISHER_QUICKSTART.md)')
          ops.write_text(text)

          gen = Path('scripts/generate-documentation-inventory.py')
          text = gen.read_text()
          text = text.replace('    "PUBLISHER_QUICKSTART.md",\n', '')
          marker = '    "README.md",\n'
          required_entry = '    "docs/developers/PUBLISHER_QUICKSTART.md",\n'
          # Add the actual quickstart to both required sets immediately after README.
          first = text.find('BILINGUAL_REQUIRED = {')
          reviewed = text.find('REVIEWED_BILINGUAL_REQUIRED = {')
          scoped = text.find('BILINGUAL_SCOPED = {')
          req_block = text[first:reviewed]
          if required_entry not in req_block:
              req_block = req_block.replace(marker, marker + required_entry, 1)
              text = text[:first] + req_block + text[reviewed:]
              reviewed = text.find('REVIEWED_BILINGUAL_REQUIRED = {')
              scoped = text.find('BILINGUAL_SCOPED = {')
          rev_block = text[reviewed:scoped]
          if required_entry not in rev_block:
              rev_block = rev_block.replace(marker, marker + required_entry, 1)
              text = text[:reviewed] + rev_block + text[scoped:]
          # It is no longer an English-only normalized developer document.
          text = text.replace('    "docs/developers/PUBLISHER_QUICKSTART.md",\n', '', 1) if text.count('    "docs/developers/PUBLISHER_QUICKSTART.md",\n') > 2 else text
          # Ensure exactly one occurrence in each bilingual set and none in normalized developer set.
          lines = text.splitlines()
          out = []
          section = None
          seen_required = seen_reviewed = False
          for line in lines:
              if line.startswith('BILINGUAL_REQUIRED = {'):
                  section = 'required'
              elif line.startswith('REVIEWED_BILINGUAL_REQUIRED = {'):
                  section = 'reviewed'
              elif line.startswith('BILINGUAL_SCOPED = {'):
                  section = 'other'
              elif line.startswith('NORMALIZED_DEVELOPER_DOCS = {'):
                  section = 'normalized_developer'
              elif line == '}':
                  section = None
              if line.strip() == '"docs/developers/PUBLISHER_QUICKSTART.md",':
                  if section == 'required':
                      if seen_required: continue
                      seen_required = True
                  elif section == 'reviewed':
                      if seen_reviewed: continue
                      seen_reviewed = True
                  elif section == 'normalized_developer':
                      continue
              out.append(line)
          text = '\n'.join(out) + '\n'
          gen.write_text(text)
          PY
          python3 scripts/generate-documentation-inventory.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md PUBLISHER_QUICKSTART.md docs/developers/PUBLISHER_QUICKSTART.md docs/operations/README.md scripts/generate-documentation-inventory.py docs/DOCUMENTATION_INVENTORY.md
          git commit -m 'docs: consolidate publisher quickstart under developers'
          git push origin HEAD:agent/fix-publisher-quickstart-placement
