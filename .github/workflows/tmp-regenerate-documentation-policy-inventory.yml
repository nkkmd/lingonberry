name: temporary regenerate documentation policy inventory

on:
  push:
    branches:
      - agent/close-documentation-policy-inventory
    paths:
      - '.github/workflows/tmp-regenerate-documentation-policy-inventory.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-documentation-policy-inventory
          fetch-depth: 0
      - name: Regenerate inventory
        run: python3 scripts/generate-documentation-inventory.py
      - name: Commit generated inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOCUMENTATION_INVENTORY.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: regenerate documentation inventory'
          git push origin HEAD:agent/close-documentation-policy-inventory
