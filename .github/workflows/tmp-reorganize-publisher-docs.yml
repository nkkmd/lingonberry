name: temporary fix publisher documentation links

on:
  push:
    branches:
      - agent/reorganize-publisher-docs
    paths:
      - '.github/workflows/tmp-reorganize-publisher-docs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reorganize-publisher-docs
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/developers/REPOSITORY_PUBLISH_WALKTHROUGH.md')
          text = path.read_text().replace(
              '[Publisher Quickstart](../developers/PUBLISHER_QUICKSTART.md)',
              '[Publisher Quickstart](./PUBLISHER_QUICKSTART.md)',
          )
          path.write_text(text)
          PY
          python3 scripts/generate-documentation-inventory.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/developers/REPOSITORY_PUBLISH_WALKTHROUGH.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: fix publisher walkthrough link'
          git push origin HEAD:agent/reorganize-publisher-docs