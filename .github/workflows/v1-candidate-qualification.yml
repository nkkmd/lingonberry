name: v1 candidate qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact fixed v1.0.0 candidate commit SHA
        required: true
        type: string
  pull_request:
    paths:
      - 'packages/**'
      - 'conformance/**'
      - 'tests/**'
      - 'scripts/v0_8_operator_acceptance.sh'
      - 'scripts/v1_0_candidate_qualification.sh'
      - '.github/workflows/v1-candidate-qualification.yml'
      - 'docs/roadmap/V1_0_CANDIDATE.md'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'conformance/**'
      - 'tests/**'
      - 'scripts/v0_8_operator_acceptance.sh'
      - 'scripts/v1_0_candidate_qualification.sh'
      - '.github/workflows/v1-candidate-qualification.yml'
      - 'docs/roadmap/V1_0_CANDIDATE.md'

permissions:
  contents: read

concurrency:
  group: v1-qualification-${{ github.ref }}-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Candidate-bound qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FIXED_CANDIDATE_SHA: 8c6b48082205a3af555130eec1f3e7d2ac8811fe
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Validate manual candidate identity
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$CANDIDATE_SHA" = "$FIXED_CANDIDATE_SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reference runner
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          systemctl --version
      - name: Run candidate qualification
        run: bash scripts/v1_0_candidate_qualification.sh target/v1-qualification
      - name: Verify machine-readable result
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = json.loads(Path('target/v1-qualification/summary.json').read_text())
          assert summary['candidateCommit'] == os.environ['CANDIDATE_SHA']
          assert summary['status'] == 'passed'
          assert summary['gates']
          assert all(g['status'] == 'passed' for g in summary['gates'])
          PY
          test -s target/v1-qualification/SHA256SUMS
          (cd target/v1-qualification && sha256sum -c SHA256SUMS)
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-qualification-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: target/v1-qualification/
          if-no-files-found: error
          retention-days: 90
