name: v1 documentation walkthrough

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact fixed candidate commit
        required: true
        type: string
      storage_sha256:
        description: SHA-256 of candidate-built lingonberry-storage
        required: true
        type: string
      relay_sha256:
        description: SHA-256 of candidate-built lingonberry-relay
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v1-documentation-walkthrough-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  walkthrough:
    name: Candidate documentation walkthrough
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ACTIVE_CANDIDATE_SHA: 8c6b48082205a3af555130eec1f3e7d2ac8811fe
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      STORAGE_SHA256: ${{ inputs.storage_sha256 }}
      RELAY_SHA256: ${{ inputs.relay_sha256 }}
    steps:
      - name: Validate explicit evidence identities
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "$ACTIVE_CANDIDATE_SHA"
          [[ "$STORAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELAY_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Checkout walkthrough harness
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute frozen documentation
        run: bash harness/scripts/run-v1-documentation-walkthrough.sh candidate harness/target/v1-documentation-walkthrough
      - name: Verify evidence bundle
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('harness/target/v1-documentation-walkthrough/summary.json')
          summary = json.loads(p.read_text())
          assert summary['candidateCommit'] == os.environ['CANDIDATE_SHA']
          assert summary['status'] == 'passed'
          assert len(summary['procedures']) == 16
          assert all(x['status'] == 'passed' for x in summary['procedures'])
          PY
          (cd harness/target/v1-documentation-walkthrough && sha256sum -c SHA256SUMS)
      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-documentation-walkthrough-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: harness/target/v1-documentation-walkthrough/
          if-no-files-found: error
          retention-days: 90
